# One level of link-following: crawl `seed`, then also crawl every link on it that
# matches `pattern` (fnmatch-style). PDFs that match get downloaded and parsed.
# Pages found this way are only fetched once; delete them from data/scraped_data.json to refresh.
follow_links:
  - seed: https://apps.alleghenycounty.us/website/MuniList.asp
    pattern: "*MuniProfile.asp?muni=*"
    category: allegheny_municipalities
  - seed: https://www.pittsburghpa.gov/City-Government/Finance-Budget/Taxes/Tax-Forms
    pattern: "*regulations.pdf"
    category: taxes
  # - seed: https://downtownpittsburgh.com/events/
  #   pattern: "*downtownpittsburgh.com/event-series/*"
  #   category: events
  - seed: https://pvgp.org/
    menus: true
    pattern:
      - "https://pvgp.org/events/*"
      - "https://pvgp.org/drivers/*"
      - "https://pvgp.org/general-event-information/*"
      - "https://pvgp.org/car-show-overview/*"
      - "https://pvgp.org/about-us/*"
      - "https://pvgp.org/charities/"
      - "https://pvgp.org/general-info-faqs/"
      - "https://pvgp.org/maps-directions/"
    category: events_venues

